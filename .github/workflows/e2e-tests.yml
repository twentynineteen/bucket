name: E2E Slow Suite

# The @slow half of the E2E suite: 250GB transfer simulations, cancellation and
# multi-minute operation states. Everything without a @slow tag runs on every
# pull request in ci.yml's e2e job, so this workflow deliberately covers only
# the expensive remainder (issue #171).
#
# There is one Playwright config and no per-spec project list, so nothing needs
# adding here when a spec is added. Tag a spec @slow and it moves to this job;
# leave it untagged and ci.yml runs it. The two are complements, so a spec can
# never fall out of both.
on:
  push:
    branches:
      - master
      - release
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - '.github/workflows/e2e-tests.yml'
  # Manual full-suite runs from the Actions tab, for exercising this on a branch
  workflow_dispatch:

jobs:
  e2e-slow:
    name: E2E Slow Suite (250GB Simulation)
    runs-on: ubuntu-24.04 # Use Linux (10x cheaper than macOS)
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lockb') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Dev server is started automatically by Playwright via webServer config
      - name: Run E2E tests (@slow)
        run: bunx playwright test --project=slow
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report-slow
          path: playwright-report/
          retention-days: 7

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: test-videos
          path: test-results/
          retention-days: 7
