name: CI
on:
  pull_request:
    branches:
      - master
      - release
  push:
    branches:
      - master
      - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install

      - name: Check test locations
        if: github.event_name == 'pull_request'
        run: scripts/check-test-locations.sh "origin/${{ github.base_ref }}...HEAD"

      - name: Run ESLint
        run: bun run eslint

      - name: Run Prettier check
        run: bun run prettier

      # The gate that was missing (issue #178). Nothing in CI ran tsc, and
      # tsconfig named an uninstalled `jest` type library, so tsc exited before
      # checking a single file and 487 type errors accumulated unseen. Neither
      # eslint nor vitest nor `vite build` type-checks: Vite transpiles without
      # checking, so a type error never failed a build either.
      - name: Run TypeScript typecheck
        run: bun run typecheck

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun run test:run

  # Gates Rust on macOS, the only platform shipped (publish.yml releases DMGs
  # and nothing else). This replaced a Linux release build, which was blind to
  # the code it claimed to guard: 19 blocks are behind cfg(target_os = "macos"),
  # including utils/macos_copyfile.rs, the native copyfile(3) transfer path that
  # BuildProject depends on. None of it compiled on Linux, so a break there
  # reached the release branch unnoticed (issue #185).
  #
  # macOS minutes bill ~10x, so this deliberately runs the tests and no bundle.
  # Full DMG bundling stays on release pushes in build-macos below.
  rust-test:
    runs-on: macos-14 # Apple Silicon, matching the aarch64 target publish.yml ships
    timeout-minutes: 30
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Set up cargo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install

      # Required, not incidental: tauri::generate_context! embeds frontendDist
      # at compile time, so cargo fails with "the frontendDist configuration is
      # set to ../dist but this path doesn't exist" if the frontend was never
      # built. It also keeps a production `vite build` in CI - the e2e job runs
      # the dev server, so nothing else would catch a production-only break.
      - name: Build frontend
        run: bun run build

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

  # macOS build is expensive (10x Linux cost) - only run on release branch pushes
  # For PRs, rust-test above compiles the same macOS code paths without bundling
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install system dependencies
        run: |
          brew install pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Set up cargo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install

      - name: Import Apple Code Signing Certificate
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Import certificate from secrets
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH

          # Create temporary keychain
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$APPLE_CERTIFICATE_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Clean up certificate file
          rm -f $CERTIFICATE_PATH

      # A verification build: it ships nothing, so it skips the updater
      # archives and never sees the updater key (see publish.yml).
      - name: Build (Apple-signed, no updater archives, no notarization)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bun run build:tauri -- --target aarch64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Clean up keychain
        if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release')
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security delete-keychain $KEYCHAIN_PATH || true

  e2e-tests:
    runs-on: ubuntu-24.04
    # Runs inside the pinned Playwright container so that screenshot baselines
    # generated by scripts/e2e-motion-baselines.sh and CI renders come from
    # one environment. Updating @playwright/test in package.json updates this
    # tag in the same PR. The container ships Chromium, so the separate
    # `playwright install --with-deps` step is no longer needed (issue #338).
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 25
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install

      # The whole E2E suite bar the @slow specs, which e2e-tests.yml runs on
      # pushes. One config, no per-spec project list: a spec added under
      # tests/e2e/ runs here with no change to this file (issue #171).
      - name: Run E2E Tests
        run: bunx playwright test --project=e2e

      # When a screenshot baseline is missing, Playwright renders it into this
      # folder and fails the test. Uploading the folder lets a reviewer check
      # the Linux-rendered baselines and commit them (issue #338).
      - name: Upload Motion screenshot baselines
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: motion-visual-snapshots
          path: tests/e2e/specs/motion-visual.spec.ts-snapshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright Report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure() # Only upload on failure to save storage
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Test Results
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
