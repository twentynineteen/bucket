name: CI
on:
  pull_request:
    branches:
      - master
      - release
  push:
    branches:
      - master
      - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        run: bun run eslint

      - name: Run Prettier check
        run: bun run prettier

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun run test:run

  # Gates Rust on macOS, the only platform shipped (publish.yml releases DMGs
  # and nothing else). This replaced a Linux release build, which was blind to
  # the code it claimed to guard: 19 blocks are behind cfg(target_os = "macos"),
  # including utils/macos_copyfile.rs, the native copyfile(3) transfer path that
  # BuildProject depends on. None of it compiled on Linux, so a break there
  # reached the release branch unnoticed (issue #185).
  #
  # macOS minutes bill ~10x, so this deliberately runs the tests and no bundle.
  # Full DMG bundling stays on release pushes in build-macos below.
  rust-test:
    runs-on: macos-14 # Apple Silicon, matching the aarch64 target publish.yml ships
    timeout-minutes: 30
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up cargo cache
        uses: actions/cache@v5
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Required, not incidental: tauri::generate_context! embeds frontendDist
      # at compile time, so cargo fails with "the frontendDist configuration is
      # set to ../dist but this path doesn't exist" if the frontend was never
      # built. It also keeps a production `vite build` in CI - the e2e job runs
      # the dev server, so nothing else would catch a production-only break.
      - name: Build frontend
        run: bun run build

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

  # macOS build is expensive (10x Linux cost) - only run on release branch pushes
  # For PRs, rust-test above compiles the same macOS code paths without bundling
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          brew install pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Set up cargo cache
        uses: actions/cache@v5
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Import Apple Code Signing Certificate
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Import certificate from secrets
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH

          # Create temporary keychain
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$APPLE_CERTIFICATE_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Clean up certificate file
          rm -f $CERTIFICATE_PATH

      - name: Build (unsigned)
        if: github.event_name == 'pull_request'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run build:tauri -- --target aarch64-apple-darwin

      - name: Build (signed, no notarization)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Skip notarization in CI (only notarize in publish workflow for releases)
          # Notarization takes 5-15+ minutes and isn't needed for CI verification
        run: bun run build:tauri -- --target aarch64-apple-darwin

      - name: Clean up keychain
        if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release')
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security delete-keychain $KEYCHAIN_PATH || true

  e2e-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lockb') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      # The whole E2E suite bar the @slow specs, which e2e-tests.yml runs on
      # pushes. One config, no per-spec project list: a spec added under
      # tests/e2e/ runs here with no change to this file (issue #171).
      - name: Run E2E Tests
        run: bunx playwright test --project=e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v5
        if: failure()  # Only upload on failure to save storage
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Test Results
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
