name: 'publish'

on:
  push:
    branches:
      - release

# Each push to `release` builds the app and uploads it to a DRAFT release for
# the version in tauri.conf.json. Nothing here can reach users: the updater
# only reads the latest *published* release, and CI never holds the updater
# signing key. Finish the release locally with ./scripts/release-local.sh,
# which notarises the DMGs, signs the updater archives, writes latest.json and
# publishes.
#
# A version that already has a tag has been published, so the run stops rather
# than touching it. Bump the version to release again.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app-version: ${{ steps.get_version.outputs.version }}
      release-notes: ${{ steps.release_notes.outputs.body }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Get app version
        id: get_version
        run: |
          VERSION=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "App version: $VERSION"

      - name: Refuse to overwrite a published release
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          # Drafts have no tag, so a tag means this version was published.
          if git ls-remote --exit-code --tags origin "refs/tags/app-v${VERSION}" >/dev/null; then
            echo "::error::app-v${VERSION} is already published. Bump the version to release again."
            exit 1
          fi

      - name: Generate release notes
        id: release_notes
        run: |
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          # Pure version-bump commits tell a user nothing, so drop them. This
          # matches only subjects that are *entirely* a bump; anything carrying
          # extra content (e.g. "bump version to 0.8.0 and update dependencies")
          # is kept, because that part is a real change.
          BUMP_ONLY='^- ([a-z]+(\([^)]*\))?: )?(bump|update) version to v?[0-9]+\.[0-9]+\.[0-9]+( in [a-z0-9_., /-]+| across all relevant files| and update changelog)? \([0-9a-f]+\)$'

          if [ -z "$LATEST_TAG" ]; then
            RANGE=""                      # First release - get all commits
          else
            RANGE="${LATEST_TAG}..HEAD"   # Commits since last tag
          fi

          # `|| true` guards the case where every commit is filtered out: grep
          # exits 1 on no matches, and a run step's default shell is `bash -e`.
          CHANGELOG=$(git log ${RANGE} --pretty=format:"- %s (%h)" --no-merges | grep -ivE "$BUMP_ONLY" || true)

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No user-facing changes since ${LATEST_TAG:-the start of the project}."
          fi

          # Create release body
          RELEASE_BODY="## What's Changed

          ${CHANGELOG}

          ## Installation

          Download the appropriate installer for your platform from the assets below.

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${LATEST_TAG}...app-v${{ steps.get_version.outputs.version }}"

          # Save to output (handle multiline)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build-tauri:
    name: Build Tauri App
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-14' # Apple Silicon runner for native arm64 builds
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-14' # Intel builds on Apple Silicon runner with cross-compilation
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up cargo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: install dependencies (macOS only)
        if: contains(matrix.platform, 'macos')
        run: |
          brew install pkg-config

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: bun install

      - name: Import Apple Code Signing Certificate (macOS only)
        if: contains(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Import certificate from secrets
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH

          # Create temporary keychain
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$APPLE_CERTIFICATE_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Clean up certificate file
          rm -f $CERTIFICATE_PATH

      # The build runs every dependency's build-time code, so the real updater
      # key must never be here. Tauri refuses to bundle updater archives
      # without a key, so give it a throwaway one; its signatures are thrown
      # away and release-local.sh signs the archives with the real key.
      - name: Generate a throwaway updater key
        run: |
          bun run tauri signer generate --ci -p "" -w "$RUNNER_TEMP/throwaway-updater.key"
          echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/throwaway-updater.key" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"

      - name: Build Tauri App (Apple-signed, updater unsigned)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          args: ${{ matrix.args }}
          tauriScript: 'bun run tauri'

      - name: Upload DMG artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: dmg-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          retention-days: 1

      - name: Upload updater artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: updater-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
          retention-days: 1

      - name: Clean up keychain (macOS only)
        if: always() && contains(matrix.platform, 'macos')
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security delete-keychain $KEYCHAIN_PATH || true

  release:
    name: Upload Draft Release
    needs: [prepare, build-tauri]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: ./artifacts

      - name: Display artifact structure
        run: ls -R ./artifacts

      - name: Rename updater archives to include architecture
        run: |
          # Both architectures produce Bucket.app.tar.gz; release assets need distinct names.
          for dir in ./artifacts/updater-*; do
            arch=$(basename "$dir" | sed 's/updater-//')
            for file in "$dir"/*.app.tar.gz; do
              mv "$file" "${file%.app.tar.gz}_${arch}.app.tar.gz"
            done
          done
          ls -la ./artifacts/updater-*

      # A draft is never served to the updater, and with no tag yet the
      # release can be rebuilt freely until release-local.sh publishes it.
      # Pin the tag to the commit that was built: without target_commitish,
      # publishing tags whatever master's HEAD is at the time.
      - name: Create or update the draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: app-v${{ needs.prepare.outputs.app-version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.prepare.outputs.app-version }} (draft - finish with scripts/release-local.sh)
          body: ${{ needs.prepare.outputs.release-notes }}
          draft: true
          prerelease: false
          files: |
            ./artifacts/dmg-*/*.dmg
            ./artifacts/updater-*/*.app.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
